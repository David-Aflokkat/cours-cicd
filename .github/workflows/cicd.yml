# DOC: https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
name: Build, test and publish Docker image

on: push

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      imageName: ${{ steps.versioning.outputs.imageName }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute versions
        id: versioning
        run: |
          version=$(git rev-parse --short HEAD)
          repository=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          imageName=ghcr.io/$repository:$version

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "imageName=$imageName" >> $GITHUB_OUTPUT

          echo "the image name: '$imageName'"
          echo "## New version '$version'" >> $GITHUB_STEP_SUMMARY
          echo "## Image '$imageName'" >> $GITHUB_STEP_SUMMARY

  unit-tests:
    runs-on: ubuntu-latest
    needs: [versioning]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run unit tests
        run: |
          go test -v .

      - name: Generate coverage report
        run: |
          go test -coverprofile=coverage.out .
          go tool cover -func=coverage.out

  build-and-push:
    runs-on: ubuntu-latest
    needs: [versioning, unit-tests]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ needs.versioning.outputs.imageName }}

      - name: Docker image summary
        run: |
          echo "## Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.versioning.outputs.imageName }}" >> $GITHUB_STEP_SUMMARY

  api-tests:
    runs-on: ubuntu-latest
    needs: [build-and-push, versioning]

    permissions:
      contents: read
      packages: read

    services:
      backend:
        image: ${{ needs.versioning.outputs.imageName }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Wait for backend
        run: |
          sleep 5

      - name: API tests
        run: |
          echo "## API tests using ${{ needs.versioning.outputs.imageName }}" >> $GITHUB_STEP_SUMMARY
          go test -v ./test/apitests

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [versioning, unit-tests, build-and-push, api-tests]

    permissions:
      contents: write

    steps:
      - name: Checkout deploy-dev branch
        uses: actions/checkout@v4
        with:
          ref: deploy-dev

      - name: Update version.txt
        run: |
          echo "${{ needs.versioning.outputs.imageName }}" > version.txt

      - name: Commit and push deployment version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add version.txt

          if git diff --cached --quiet; then
            echo "No deployment version change"
          else
            git commit -m "Deploy dev version ${{ needs.versioning.outputs.version }}"
            git push origin deploy-dev
          fi
